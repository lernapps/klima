# The texts of the screen of the exercise "Klimadetektiv" (component KlimaDetektiv): one record.
- task: "Wie sieht das Klimadiagramm für einen Ort in Europa aus? Du bekommst nur Hinweise zur Lage. Zeichne deine Vermutung für Temperatur und Niederschlag in allen zwölf Monaten."
  alt: "Achsenkreuz für das Klimadiagramm, in das du deine Vermutung einträgst. Links die Temperatur in °C, rechts der Niederschlag in mm, unten die zwölf Monate."
  hinweisKopf: "Hinweise zum Ort"
  hinweisBreite: "Breite: {breite} °N"
  hinweisHoehe: "Höhe der Messstation: {hoehe} m"
  hinweisLage: "Lage: {lage}"
  anleitung: "Wähle erst, ob du gerade die Temperatur oder den Niederschlag zeichnest. Tippe dann im Achsenkreuz in einem Monat auf die Höhe, die du für richtig hältst. Oder wähle den Monat und schreibe die Zahl in das Feld. Mit der Tastatur: Tab bringt dich zu den Monaten, Pfeil hoch und runter ändern den Wert, Pfeil links und rechts wechseln den Monat. Wenn du alle zwölf Temperaturen gezeichnet hast, wechselt die Auswahl von selbst zum Niederschlag. Zeichne alle zwölf Monate."
  reiheWahl: "Du zeichnest gerade"
  reiheTemperatur: "Temperatur (rote Linie)"
  reiheNiederschlag: "Niederschlag (blaue Säulen)"
  monatKopf: "Gewählter Monat: {monat}"
  feldTemperatur: "Temperatur in °C"
  feldNiederschlag: "Niederschlag in mm"
  zurueck: "voriger Monat"
  weiter: "nächster Monat"
  zuruecksetzen: "Alles löschen"
  zaehler: "{n} von 24 Werten gezeichnet"
  legendeTemperatur: "Temperatur (rote Linie)"
  legendeNiederschlag: "Niederschlag (blaue Säulen)"

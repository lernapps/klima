  achseMm: "mm"
  keineZahl: "Das ist keine Zahl. Schreibe zum Beispiel 12 oder 12,5."
  begrenzt: "Dieser Wert liegt außerhalb des Achsenkreuzes. Ich habe ihn auf {wert} gesetzt."
  hinweisKurz: "Breite {breite} °N, Höhe {hoehe} m. Lage: {lage}"
  plausibel: "Das war {ort}. Dein Diagramm ist plausibel: Jahresmittel, Temperaturspanne, wärmster und kältester Monat, Jahresniederschlag, feuchte Monate und die Jahreszeit des Regens passen zum Ort. Unter „Lösung“ siehst du die Werte."

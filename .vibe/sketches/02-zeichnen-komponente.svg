<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="sans-serif" font-size="14">
<title>Skizze Komponente "Diagramm zeichnen"</title>
<rect width="640" height="560" fill="#fff" stroke="#999"/>
<text x="20" y="30" font-size="18" font-weight="bold">Zeichne das Klimadiagramm für Berlin</text>
<text x="20" y="54" fill="#555">Stelle für jeden Monat Temperatur und Niederschlag aus der Tabelle ein.</text>
<g stroke="#999" fill="none"><rect x="20" y="70" width="600" height="60"/></g>
<text x="28" y="95">Tabelle (gegeben): Monat | J | F | M | A | ... | D</text>
<text x="28" y="116">Temperatur °C | 0,6 | 1,2 | 4,6 | ...  /  Niederschlag mm | 42 | 33 | 41 | ...</text>
<text x="20" y="160" font-weight="bold">Dein Diagramm (zeigt nur, was du eingestellt hast)</text>
<rect x="20" y="170" width="400" height="220" fill="#f4f8fc" stroke="#69c"/>
<polyline points="50,330 90,325 130,310 170,290 210,260 250,235 290,225 330,230 370,250" fill="none" stroke="#c33" stroke-width="3" stroke-dasharray="1 0"/>
<g fill="#39c"><rect x="44" y="330" width="14" height="30"/><rect x="84" y="335" width="14" height="25"/><rect x="124" y="328" width="14" height="32"/></g>
<rect x="440" y="170" width="180" height="220" fill="#fffbea" stroke="#cc9"/>
<text x="450" y="192" font-weight="bold">Monat: Januar</text>
<text x="450" y="218">Temperatur  [ − ] 0,6 [ + ]</text>
<text x="450" y="248">Regen       [ − ] 42  [ + ]</text>
<text x="450" y="278">&#9664; voriger  nächster &#9654;</text>
<text x="450" y="312" fill="#555">Tastatur: Pfeile,</text><text x="450" y="330" fill="#555">Zahlenfeld je Monat</text>
<rect x="20" y="410" width="120" height="32" fill="#eee" stroke="#666"/><text x="48" y="431">Prüfen</text>
<rect x="150" y="410" width="160" height="32" fill="#eee" stroke="#666"/><text x="160" y="431">Zurücksetzen</text>
<text x="20" y="476" font-weight="bold">Nach "Prüfen":</text>
<text x="20" y="498" fill="#a22">falsch: "Im April hast du 18 °C. In der Tabelle steht 9 °C." (Monat benannt)</text>
<text x="20" y="520" fill="#a22">Achsen vertauscht? "Das sieht nach Niederschlag aus, nicht nach Temperatur."</text>
<text x="20" y="542" fill="#272">richtig: alle Monate innerhalb ±1 °C und ±10 mm</text>
</svg>
